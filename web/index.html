<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rosea — Salon</title>
<meta name="description" content="Rosea — book your appointment online. Launching soon.">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Segoe UI",-apple-system,Helvetica,Arial,sans-serif;
    background:radial-gradient(ellipse 90% 70% at 30% 25%,#3a2630 0%,#2a2024 55%,#160f13 100%);
    color:#f5edf1;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative;
  }
  .wm{position:absolute;right:-120px;bottom:-160px;font-size:620px;line-height:1;color:rgba(201,162,75,.05);font-family:Georgia,serif}
  .card{position:relative;z-index:1;padding:40px}
  .mark{width:64px;height:64px;border-radius:50%;margin:0 auto 26px;display:flex;align-items:center;justify-content:center;
    font-size:32px;color:#160f13;background:linear-gradient(135deg,#b76e79,#c9a24b)}
  .kick{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:14px;letter-spacing:5px;text-transform:uppercase;color:#d6a86f}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(64px,16vw,160px);line-height:1;margin:14px 0 6px;
    background:linear-gradient(120deg,#f7f2ef 0%,#f0d9c4 45%,#c9a24b 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  p.sub{font-size:clamp(18px,4vw,26px);color:#e8dde2;font-weight:300}
  .soon{display:inline-block;margin-top:34px;border:1px solid rgba(214,168,111,.6);border-radius:30px;
    padding:14px 28px;font-size:15px;letter-spacing:2px;text-transform:uppercase;color:#f0e4d9}
  .foot{position:absolute;bottom:26px;left:0;right:0;z-index:1;font-size:13px;color:rgba(245,237,241,.45);letter-spacing:1px}
</style>
</head>
<body>
  <div class="wm">✦</div>
  <div class="card">
    <div class="mark">✦</div>
    <div class="kick">Beauty Salon</div>
    <h1>Rosea</h1>
    <p class="sub">Online booking &amp; so much more — launching soon.</p>
    <div class="soon">✦ &nbsp; Coming soon</div>
  </div>
  <div class="foot">Rosea · book your appointment online, any time.</div>
</body>
</html>
