name: deploy

# develop → staging, main → production.
# Backend = push Supabase migrations to the cloud project for that environment.
# Frontend = Cloudflare Pages' Git integration (connect the repo once, production
#   branch = main, root dir = web) auto-deploys preview (develop/PRs) + production
#   (main) URLs — no job needed here. This workflow handles the backend + posts a
#   deploy embed. (Next.js on Pages later via the OpenNext adapter; static for now.)
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  backend:
    name: backend → ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest
    # GitHub Environments carry the per-env secrets:
    #   staging  : SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
    #   production: SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
    # plus a repo/org secret SUPABASE_ACCESS_TOKEN.
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Push migrations to the cloud project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Supabase deploy secrets not set for this environment — skipping. Add SUPABASE_ACCESS_TOKEN + the environment's SUPABASE_PROJECT_REF / SUPABASE_DB_PASSWORD to enable."
            exit 0
          fi
          npx supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          npx supabase db push --password "$DB_PASSWORD"

      - name: Notify Discord
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          job: "Deploy BE → ${{ github.ref_name == 'main' && 'PRODUCTION' || 'staging' }}"
          status: ${{ job.status }}
          details: "${{ github.ref_name == 'main' && '🚀 **Production**' || '🧪 **Staging**' }} backend deploy from `${{ github.ref_name }}` — Supabase migrations pushed."
