name: supabase

on:
  pull_request: # every PR (into develop or main)
    paths:
      - "supabase/**"
      - "package.json"
      - ".github/workflows/supabase.yml"
  push:
    branches: [develop] # and pushes to the integration branch
  workflow_dispatch:

# CI never touches the cloud project — it spins up a throwaway local stack.
# Posts a large Discord embed (pass/fail GIF) when the DB job finishes.
jobs:
  db:
    name: migrations · lint · pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Start local Supabase (DB only — avoids pulling the full stack)
        # Only Postgres is needed for migrations + pgTAP. Excluding the rest cuts
        # ~10 image pulls (public ECR anonymous pulls get rate-limited on shared
        # runner IPs). Retry a couple of times in case a pull still rate-limits.
        run: |
          for i in 1 2 3; do
            npx supabase start \
              -x studio,realtime,storage-api,imgproxy,edge-runtime,logflare,vector,mailpit,gotrue \
              && break
            echo "::warning::supabase start attempt $i failed (likely registry rate limit) — retrying in 25s"
            npx supabase stop --no-backup >/dev/null 2>&1 || true
            sleep 25
          done
          npx supabase status
      - name: Lint schema
        run: npx supabase db lint --level error
      - name: Apply migrations from scratch + seed
        run: npx supabase db reset
      - name: pgTAP tests
        run: npx supabase test db
      - name: Stop
        if: always()
        run: npx supabase stop
      - name: Notify Discord
        if: always()
        uses: ./.github/actions/discord-notify
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          job: "DB — migrations · lint · pgTAP"
          status: ${{ job.status }}
